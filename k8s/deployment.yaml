apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      containers:
        - name: django
          image: varun7560/v_mart-devops-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000